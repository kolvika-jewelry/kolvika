# Add this location block to each of the three HTTPS server blocks:
# custom.kolvika.jewelry, repair.kolvika.jewelry, quiz.kolvika.jewelry.
location = /api/leads {
    client_max_body_size 32k;
    limit_except POST { deny all; }

    proxy_pass http://127.0.0.1:3210/api/leads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}

# Register this exact HTTPS URL as the amoCRM integration Redirect URI:
# https://custom.kolvika.jewelry/api/amocrm/callback
location = /api/amocrm/callback {
    # OAuth authorization codes arrive in the query string; never log this URI.
    access_log off;
    proxy_pass http://127.0.0.1:3210/api/amocrm/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}

location = /api/amocrm/oauth-complete {
    proxy_pass http://127.0.0.1:3210/api/amocrm/oauth-complete;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}
