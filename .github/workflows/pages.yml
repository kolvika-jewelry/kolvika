name: Publish Kolvika landing

on:
  push:
    branches:
      - main
    paths:
      - 'landings/custom-jewelry/dist/**'
      - 'landings/custom-jewelry-quiz/dist/**'
      - 'landings/custom-jewelry-studio/dist/**'
      - 'landings/jewelry-story/dist/**'
      - 'landings/jewelry-repair/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble landings
        run: |
          mkdir -p _site/repair _site/quiz _site/studio _site/gift
          cp -R landings/custom-jewelry/dist/. _site/
          cp -R landings/jewelry-repair/dist/. _site/repair/
          cp -R landings/custom-jewelry-quiz/dist/. _site/quiz/
          cp -R landings/custom-jewelry-studio/dist/. _site/studio/
          cp -R landings/jewelry-story/dist/. _site/gift/
          cp -R landings/custom-jewelry/dist/assets _site/repair/assets
      - name: Upload landing
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
